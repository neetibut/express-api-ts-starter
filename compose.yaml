services:
  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: http://localhost:3000
    ports:
      - '3000:3000'
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/api/v1/health/live',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
